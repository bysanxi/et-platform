extend.redis.enabled=true
extend.redis.lock.enabled=true
extend.mybatis-plus.multi-tenant.strategy=local

spring.datasource.dynamic.aop.enabled=false
extend.mybatis-plus.multi-tenant.type=column

extend.mybatis-plus.multi-tenant.include-tables=c_login_log,c_opt_log,sys_org,sys_role,t_user

spring.main.allow-bean-definition-overriding=true
logging.level.cool.et=debug
logging.level.springfox.documentation=warn

spring.datasource.dynamic.primary=master
spring.datasource.dynamic.strict=true
spring.datasource.dynamic.datasource.master.pool-name=HikariDataSourcePool
spring.datasource.dynamic.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.dynamic.datasource.master.url=${ET_DB_URL:jdbc:mysql://127.0.0.1:3306/et_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.dynamic.datasource.master.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.dynamic.datasource.master.username=${ET_DB_USER:root}
spring.datasource.dynamic.datasource.master.password=${ET_DB_PASSWORD:123456}
spring.datasource.dynamic.hikari.max-pool-size=15
spring.datasource.dynamic.hikari.max-lifetime=1800000
spring.datasource.dynamic.hikari.connection-timeout=30000
spring.datasource.dynamic.hikari.min-idle=5
spring.datasource.dynamic.hikari.is-auto-commit=true
