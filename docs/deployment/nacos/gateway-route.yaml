spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: et-platform-iam
              uri: lb://et-platform-iam
              predicates:
                - Path=/iam/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100   # 允许用户每秒处理多少个请求
                    redis-rate-limiter.burstCapacity: 100   # 令牌桶的容量，允许在一秒钟内完成的最大请求数
                    # 使用 IP 限流策略（使用 SpEL 按名称引用 bean）
                    key-resolver: "#{@ipKeyResolver}"
                - StripPrefix=1
                - PreserveHostHeader
                - name: Retry
                  args:
                    retries: 1
                    statuses: BAD_GATEWAY
                    backoff:
                      firstBackoff: 200ms
                      maxBackoff: 500ms
                      factor: 1
                      basedOnPreviousValue: false
                      exceptions: TimeoutException
            - id: et-stock-assistant
              uri: lb://et-stock-assistant
              predicates:
                - Path=/et/assistant/**
              filters:
                - StripPrefix=2
                - PreserveHostHeader
              metadata:
                response-timeout: -1
            - id: et-stock-meta-service
              uri: lb://et-stock-meta-service
              predicates:
                - Path=/et/meta/**
              filters:
                - StripPrefix=2
                - PreserveHostHeader

            - id: et-stock-data-service
