server:
  port: 15000
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: et-platform-gateway
  config:
    import:
      - classpath:cloud-default.yaml
      - classpath:redis.properties
      - classpath:et-platform-gateway.properties
      - optional:nacos:${spring.application.name}.properties
      - optional:nacos:redis.properties
      - optional:nacos:cloud-default.yaml
      - optional:classpath:gateway-swagger.yaml
      - optional:classpath:gateway-route.yaml
      - optional:nacos:gateway-route.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        namespace: ${NACOS_NAMESPACE:et-platform}
      config:
        server-addr: ${spring.cloud.nacos.server-addr}
        namespace: ${NACOS_NAMESPACE:et-platform}
